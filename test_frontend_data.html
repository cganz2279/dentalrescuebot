<!DOCTYPE html>
<html>
<head>
    <title>Frontend Data Test</title>
</head>
<body>
    <h1>Testing Frontend API Data</h1>
    <div id="results"></div>

    <script>
    async function testAPI() {
        try {
            const response = await fetch('https://dentist-portal-3.emergent.host/api/procedures/wisdom-tooth-removal');
            const data = await response.json();
            
            const resultsDiv = document.getElementById('results');
            
            let html = '<h2>API Response Test</h2>';
            html += '<h3>Medications:</h3><ul>';
            
            if (data.data && data.data.medications) {
                data.data.medications.forEach((med, index) => {
                    html += `<li><strong>Med ${index + 1}:</strong> "${med}"</li>`;
                    html += `<li style="color: blue;">Length: ${med.length} chars</li>`;
                    html += `<li style="color: green;">First 20: "${med.substring(0, 20)}"</li>`;
                    html += `<li style="color: red;">Last 20: "${med.substring(med.length - 20)}"</li><br>`;
                });
            } else {
                html += '<li>No medications found</li>';
            }
            
            html += '</ul><h3>Diet Restrictions:</h3><ul>';
            
            if (data.data && data.data.dietRestrictions) {
                data.data.dietRestrictions.forEach((diet, index) => {
                    html += `<li><strong>Diet ${index + 1}:</strong> "${diet}"</li>`;
                    html += `<li style="color: blue;">Length: ${diet.length} chars</li><br>`;
                });
            } else {
                html += '<li>No diet restrictions found</li>';
            }
            
            html += '</ul>';
            resultsDiv.innerHTML = html;
            
        } catch (error) {
            document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }
    
    // Run test when page loads
    testAPI();
    </script>
</body>
</html>
