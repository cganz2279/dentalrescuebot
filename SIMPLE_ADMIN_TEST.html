<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Test - DentalRescueBot</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        .test-header {
            background: #1e40af;
            color: white;
            padding: 1rem;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .iframe-test {
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        .status {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 4px solid #2563eb;
        }
        .error {
            border-left-color: #dc2626;
            background: #fee2e2;
        }
        .success {
            border-left-color: #059669;
            background: #d1fae5;
        }
    </style>
</head>
<body>
    <div class="test-header">
        <h1>DentalRescueBot Admin Test Page</h1>
        <p>Testing iframe loading...</p>
    </div>
    
    <div class="status" id="status">
        🔄 Loading React app...
    </div>
    
    <div class="status">
        <strong>Direct Link:</strong> 
        <a href="https://carebot-1.preview.emergentagent.com/" target="_blank">
            Open DentalRescueBot App in New Tab
        </a>
    </div>
    
    <div class="iframe-test">
        <iframe 
            id="testIframe"
            src="https://carebot-1.preview.emergentagent.com/" 
            width="100%" 
            height="600px"
            frameborder="0"
            onload="iframeLoaded()"
            onerror="iframeError()">
        </iframe>
    </div>

    <script>
        let loadTimeout;
        
        function iframeLoaded() {
            clearTimeout(loadTimeout);
            document.getElementById('status').innerHTML = '✅ <strong>Success!</strong> React app loaded in iframe';
            document.getElementById('status').className = 'status success';
        }
        
        function iframeError() {
            clearTimeout(loadTimeout);
            document.getElementById('status').innerHTML = '❌ <strong>Error!</strong> Failed to load React app in iframe';
            document.getElementById('status').className = 'status error';
        }
        
        // Set a timeout to detect if iframe doesn't load
        loadTimeout = setTimeout(function() {
            const iframe = document.getElementById('testIframe');
            try {
                // Try to access iframe content (will fail if blocked)
                iframe.contentDocument;
                document.getElementById('status').innerHTML = '⚠️ <strong>Timeout!</strong> Iframe may be blocked or slow to load';
                document.getElementById('status').className = 'status error';
            } catch (e) {
                document.getElementById('status').innerHTML = '🚫 <strong>Blocked!</strong> Iframe access is restricted by security policy';
                document.getElementById('status').className = 'status error';
            }
        }, 10000); // 10 second timeout
    </script>
</body>
</html>
