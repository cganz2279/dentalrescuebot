<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalRescueBot - Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            height: 60px;
            margin-bottom: 2rem;
        }
        .loading-title {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 1rem;
        }
        .loading-subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .access-link {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 1rem;
            font-weight: 600;
        }
        .access-link:hover {
            background: #1d4ed8;
        }
    </style>
    <script>
        // Immediate redirect to React app
        window.location.href = 'https://carebot-2.preview.emergentagent.com/';
    </script>
</head>
<body>
    <div class="loading-container">
        <img src="https://customer-assets.emergentagent.com/job_dental-healing/artifacts/j7ayzg7r_DentalRescueBotWithRoundedText.png" 
             alt="DentalRescueBot" class="logo">
        
        <h1 class="loading-title">Loading DentalRescueBot</h1>
        <p class="loading-subtitle">Redirecting to application...</p>
        
        <div class="loading-spinner"></div>
        
        <p style="color: #6b7280; font-size: 14px;">
            If you're not redirected automatically,
            <a href="https://carebot-2.preview.emergentagent.com/" class="access-link">
                click here to access the application
            </a>
        </p>
    </div>
</body>
</html>
