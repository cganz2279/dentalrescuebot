<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body style="margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #2c3e50; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div style="background: white; padding: 0; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; overflow: hidden;">
        
        <!-- Header -->
        <div style="background: #dc3545; color: white; padding: 25px; text-align: center;">
            <h1 style="margin: 0; font-size: 24px;">🔐 ADMIN LOGIN</h1>
            <p style="margin: 5px 0 0 0; opacity: 0.9;">Administrator Access</p>
        </div>
        
        <!-- Form -->
        <div style="padding: 30px;">
            <div id="message" style="padding: 12px; margin-bottom: 20px; border-radius: 6px; display: none;"></div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">Admin Email:</label>
                <input type="email" id="email" value="cganz@admin.com" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">Password:</label>
                <input type="password" id="password" value="Dentist1#" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box;">
            </div>
            
            <button onclick="adminLogin()" id="loginBtn" style="width: 100%; padding: 15px; background: #dc3545; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer;">
                LOGIN AS ADMIN
            </button>
        </div>
        
    </div>

    <script>
        function showMessage(text, isError) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            msg.style.background = isError ? '#ffebee' : '#e8f5e8';
            msg.style.color = isError ? '#c62828' : '#2e7d32';
            msg.style.border = '1px solid ' + (isError ? '#ffcdd2' : '#c8e6c9');
        }

        async function adminLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showMessage('Please enter email and password', true);
                return;
            }
            
            btn.textContent = 'LOGGING IN...';
            btn.disabled = true;
            
            try {
                const response = await fetch('https://dentist-portal-3.emergent.host/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    showMessage('Admin login successful!', false);
                    
                    // Replace page content with dashboard
                    setTimeout(() => {
                        document.body.innerHTML = `
                            <div style="max-width: 900px; margin: 20px auto; background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden;">
                                <div style="background: #dc3545; color: white; padding: 25px; text-align: center;">
                                    <h1 style="margin: 0; font-size: 28px;">🎛️ ADMIN DASHBOARD</h1>
                                    <button onclick="localStorage.removeItem('adminToken'); location.reload();" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 15px; border-radius: 4px; cursor: pointer;">Logout</button>
                                </div>
                                <div style="padding: 30px;">
                                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px;">
                                        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border-left: 4px solid #dc3545;">
                                            <div style="font-size: 32px; font-weight: bold; color: #dc3545;" id="practiceCount">Loading...</div>
                                            <div style="color: #666; font-size: 14px;">Total Practices</div>
                                        </div>
                                        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border-left: 4px solid #28a745;">
                                            <div style="font-size: 32px; font-weight: bold; color: #28a745;" id="activeCount">Loading...</div>
                                            <div style="color: #666; font-size: 14px;">Active Practices</div>
                                        </div>
                                        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border-left: 4px solid #ffc107;">
                                            <div style="font-size: 32px; font-weight: bold; color: #ffc107;" id="revenueCount">Loading...</div>
                                            <div style="color: #666; font-size: 14px;">Total Revenue</div>
                                        </div>
                                    </div>
                                    <div style="background: #d4edda; padding: 25px; border-radius: 8px; text-align: center; border: 2px solid #28a745;">
                                        <h2 style="margin: 0 0 10px 0; color: #155724;">✅ ADMIN ACCESS ACTIVE</h2>
                                        <p style="margin: 0; color: #155724;">You are logged in as system administrator</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        // Load dashboard data
                        loadDashboardData(data.token);
                        
                    }, 1000);
                } else {
                    showMessage('Invalid admin credentials', true);
                }
            } catch (error) {
                showMessage('Connection error', true);
            } finally {
                btn.textContent = 'LOGIN AS ADMIN';
                btn.disabled = false;
            }
        }
        
        async function loadDashboardData(token) {
            try {
                const response = await fetch('https://dentist-portal-3.emergent.host/api/admin/dashboard', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                if (data.success && data.stats) {
                    document.getElementById('practiceCount').textContent = data.stats.total_practices || 0;
                    document.getElementById('activeCount').textContent = data.stats.active_practices || 0;
                    document.getElementById('revenueCount').textContent = '$' + (data.stats.total_revenue || 0);
                }
            } catch (error) {
                console.error('Dashboard error:', error);
            }
        }

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') adminLogin();
        });
    </script>
</body>
</html>
