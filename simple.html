<!DOCTYPE html>
<html>
<head><title>Admin</title></head>
<body style="margin:0;padding:20px;font-family:Arial;background:#2c3e50;min-height:100vh;display:flex;align-items:center;justify-content:center;">
<div style="background:white;padding:0;border-radius:10px;width:100%;max-width:400px;overflow:hidden;">
<div style="background:#dc3545;color:white;padding:25px;text-align:center;">
<h1 style="margin:0;font-size:24px;">🔐 ADMIN LOGIN</h1>
</div>
<div style="padding:30px;">
<div id="msg" style="padding:12px;margin-bottom:20px;border-radius:6px;display:none;"></div>
<div style="margin-bottom:20px;">
<label style="display:block;margin-bottom:8px;font-weight:bold;color:#333;">Email:</label>
<input type="email" id="email" value="cganz@admin.com" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:6px;box-sizing:border-box;">
</div>
<div style="margin-bottom:25px;">
<label style="display:block;margin-bottom:8px;font-weight:bold;color:#333;">Password:</label>
<input type="password" id="pwd" value="Dentist1#" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:6px;box-sizing:border-box;">
</div>
<button onclick="login()" id="btn" style="width:100%;padding:15px;background:#dc3545;color:white;border:none;border-radius:6px;font-size:18px;cursor:pointer;">LOGIN</button>
</div>
</div>
<script>
function login(){
var e=document.getElementById('email').value;
var p=document.getElementById('pwd').value;
var b=document.getElementById('btn');
var m=document.getElementById('msg');
if(!e||!p){m.textContent='Enter email and password';m.style.display='block';m.style.background='#ffebee';m.style.color='#c62828';return;}
b.textContent='LOGGING IN...';b.disabled=true;
fetch('https://dentist-portal-3.emergent.host/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})})
.then(r=>r.json()).then(d=>{
if(d.success){
localStorage.setItem('adminToken',d.token);
m.textContent='SUCCESS! Loading dashboard...';m.style.display='block';m.style.background='#e8f5e8';m.style.color='#2e7d32';
setTimeout(()=>{
document.body.innerHTML='<div style="max-width:900px;margin:20px auto;background:white;border-radius:10px;overflow:hidden;"><div style="background:#dc3545;color:white;padding:25px;text-align:center;"><h1 style="margin:0;">🎛️ ADMIN DASHBOARD</h1><button onclick="localStorage.removeItem(\'adminToken\');location.reload();" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);color:white;border:none;padding:8px 15px;border-radius:4px;cursor:pointer;">Logout</button></div><div style="padding:30px;"><div style="background:#d4edda;padding:25px;border-radius:8px;text-align:center;"><h2 style="margin:0 0 10px 0;color:#155724;">✅ ADMIN ACCESS GRANTED</h2><p style="margin:0;color:#155724;">Administrator dashboard loaded successfully</p></div></div></div>';
},1500);
}else{
m.textContent='Login failed';m.style.display='block';m.style.background='#ffebee';m.style.color='#c62828';
}
}).catch(()=>{
m.textContent='Connection error';m.style.display='block';m.style.background='#ffebee';m.style.color='#c62828';
}).finally(()=>{b.textContent='LOGIN';b.disabled=false;});
}
</script>
</body>
</html>
