<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DentalRescueBot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            min-height: 100vh;
        }
        .admin-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .admin-card {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        .logo {
            height: 60px;
            margin-bottom: 2rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .admin-title {
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .admin-subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1f2937;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 1rem;
        }
        .login-btn:hover {
            transform: translateY(-1px);
        }
        .login-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 14px;
        }
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 14px;
        }
        .credentials-hint {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            margin-top: 1rem;
            font-size: 14px;
        }
        .credentials-hint h4 {
            margin: 0 0 8px 0;
            color: #374151;
            font-size: 14px;
        }
        .credentials-hint p {
            margin: 4px 0;
            color: #6b7280;
            font-family: monospace;
        }
        .quick-login {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .quick-btn {
            background: #f9fafb;
            border: 1px solid #d1d5db;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            color: #374151;
        }
        .quick-btn:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <img src="https://customer-assets.emergentagent.com/job_dental-healing/artifacts/j7ayzg7r_DentalRescueBotWithRoundedText.png" 
                 alt="DentalRescueBot" class="logo">
            
            <h1 class="admin-title">Admin Login</h1>
            <p class="admin-subtitle">Access the system administration panel</p>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter admin email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Login to Admin Panel
                </button>
            </form>
            
            <div class="credentials-hint">
                <h4>Available Admin Accounts:</h4>
                <div style="margin-bottom: 12px;">
                    <p><strong>Super Admin:</strong></p>
                    <p>Email: admin@theoncallbot.com</p>
                    <p>Password: your-super-admin-password-123</p>
                    <div class="quick-login">
                        <button type="button" class="quick-btn" onclick="fillSuperAdmin()">Use Super Admin</button>
                    </div>
                </div>
                <div>
                    <p><strong>Practice Admin:</strong></p>
                    <p>Email: cganz2279@gmail.com</p>
                    <p>Password: admin123</p>
                    <div class="quick-login">
                        <button type="button" class="quick-btn" onclick="fillPracticeAdmin()">Use Practice Admin</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://carebot-2.preview.emergentagent.com/api';
        
        function fillSuperAdmin() {
            document.getElementById('email').value = 'admin@theoncallbot.com';
            document.getElementById('password').value = 'your-super-admin-password-123';
        }
        
        function fillPracticeAdmin() {
            document.getElementById('email').value = 'cganz2279@gmail.com';
            document.getElementById('password').value = 'admin123';
        }
        
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Reset messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';
            
            try {
                // Try super admin login first
                let response;
                let isSuper = false;
                
                if (email === 'admin@theoncallbot.com') {
                    try {
                        response = await fetch(`${BACKEND_URL}/admin/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, password })
                        });
                        isSuper = true;
                    } catch (e) {
                        console.log('Super admin endpoint failed, trying regular login');
                    }
                }
                
                // If super admin login failed or different email, try regular login
                if (!response || !response.ok) {
                    response = await fetch(`${BACKEND_URL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password })
                    });
                    isSuper = false;
                }
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    const user = data.user;
                    const userRole = user.role;
                    
                    // Check if user has admin access
                    if (userRole === 'super_admin' || userRole === 'admin' || userRole === 'practice_admin') {
                        // Store credentials
                        localStorage.setItem('dentalToken', data.token);
                        localStorage.setItem('dentalUser', JSON.stringify(user));
                        
                        successMessage.textContent = `Welcome ${user.firstName}! Access granted as ${userRole}. Redirecting...`;
                        successMessage.style.display = 'block';
                        
                        setTimeout(() => {
                            // Redirect to the React app with admin access
                            if (userRole === 'super_admin' || userRole === 'admin') {
                                window.location.href = 'https://carebot-2.preview.emergentagent.com/admin';
                            } else {
                                window.location.href = 'https://carebot-2.preview.emergentagent.com/';
                            }
                        }, 2000);
                    } else {
                        throw new Error(`Access denied. User role "${userRole}" does not have admin privileges.`);
                    }
                } else {
                    throw new Error(data.detail || data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Admin Panel';
            }
        });
    </script>
</body>
</html>
