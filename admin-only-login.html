<!DOCTYPE html>
<html>
<head>
    <title>ADMINISTRATOR LOGIN ONLY</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
            background: linear-gradient(45deg, #8B0000, #DC143C);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 400px;
            text-align: center;
        }
        .admin-header {
            background: linear-gradient(45deg, #8B0000, #DC143C);
            color: white;
            padding: 20px;
            margin: -40px -40px 30px -40px;
            border-radius: 15px 15px 0 0;
        }
        .admin-title { 
            font-size: 24px; 
            font-weight: bold; 
            margin: 0;
        }
        .admin-subtitle {
            font-size: 14px;
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        .form-group { 
            margin-bottom: 25px; 
            text-align: left;
        }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold;
            color: #333;
        }
        .form-group input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px;
            box-sizing: border-box;
        }
        .admin-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #8B0000, #DC143C);
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .admin-btn:hover { 
            background: linear-gradient(45deg, #600000, #B91C1C);
        }
        .admin-btn:disabled { 
            background: #ccc; 
        }
        .message { 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            display: none; 
        }
        .error { 
            background: #ffebee; 
            color: #c62828; 
            border: 1px solid #ffcdd2;
        }
        .success { 
            background: #e8f5e8; 
            color: #2e7d32; 
            border: 1px solid #c8e6c9;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-title">🔐 ADMINISTRATOR ACCESS</div>
            <div class="admin-subtitle">System Administration Portal</div>
        </div>
        
        <div class="warning">
            <strong>⚠️ ADMIN ACCESS ONLY</strong><br>
            This is for system administrators only. Unauthorized access is prohibited.
        </div>
        
        <div id="message" class="message"></div>
        
        <form id="adminForm">
            <div class="form-group">
                <label>Administrator Email:</label>
                <input type="email" id="adminEmail" value="cganz@admin.com" required>
            </div>
            <div class="form-group">
                <label>Administrator Password:</label>
                <input type="password" id="adminPassword" value="Dentist1#" required>
            </div>
            <button type="submit" id="adminBtn" class="admin-btn">
                🛡️ ADMIN LOGIN
            </button>
        </form>
        
        <div style="margin-top: 30px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 12px; color: #666;">
            Administrative access for Practice Notes management system
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('adminBtn');
            
            btn.textContent = 'AUTHENTICATING...';
            btn.disabled = true;
            
            try {
                const response = await fetch('https://dentist-portal-3.emergent.host/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    showMessage('ADMIN ACCESS GRANTED! Loading dashboard...', 'success');
                    
                    setTimeout(() => {
                        // Create admin dashboard in the same page
                        document.body.innerHTML = `
                            <div style="max-width: 1000px; margin: 20px auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden;">
                                <div style="background: linear-gradient(45deg, #8B0000, #DC143C); color: white; padding: 30px; text-align: center;">
                                    <h1 style="margin: 0; font-size: 28px;">🎛️ ADMINISTRATOR DASHBOARD</h1>
                                    <p style="margin: 10px 0 0 0;">System Management Console</p>
                                </div>
                                <div style="padding: 30px;">
                                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; border-left: 4px solid #8B0000;">
                                            <div style="font-size: 32px; font-weight: bold; color: #8B0000;">0</div>
                                            <div style="color: #666;">Total Practices</div>
                                        </div>
                                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; border-left: 4px solid #DC143C;">
                                            <div style="font-size: 32px; font-weight: bold; color: #DC143C;">0</div>
                                            <div style="color: #666;">Active Users</div>
                                        </div>
                                        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; border-left: 4px solid #28a745;">
                                            <div style="font-size: 32px; font-weight: bold; color: #28a745;">$0</div>
                                            <div style="color: #666;">Revenue</div>
                                        </div>
                                    </div>
                                    <div style="background: #d4edda; padding: 25px; border-radius: 10px; border: 2px solid #28a745; text-align: center;">
                                        <h2 style="margin: 0 0 15px 0; color: #155724;">✅ ADMINISTRATOR ACCESS GRANTED</h2>
                                        <p style="margin: 0; color: #155724;">You are now logged in with full administrative privileges</p>
                                        <button onclick="localStorage.removeItem('adminToken'); location.reload();" style="margin-top: 15px; padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer;">Logout</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }, 1500);
                } else {
                    showMessage('ADMIN ACCESS DENIED: ' + (data.detail || 'Invalid credentials'), 'error');
                }
            } catch (error) {
                showMessage('CONNECTION ERROR: Unable to authenticate', 'error');
            } finally {
                btn.textContent = '🛡️ ADMIN LOGIN';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
