<!DOCTYPE html>
<html>
<head>
    <title>Simple Admin Login Test</title>
</head>
<body>
    <h1>Simple Admin Login Test</h1>
    <form id="adminForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="cganz@admin.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="Dentist1#" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            console.log('Testing admin login...');
            console.log('Email:', email);
            
            try {
                const response = await fetch('https://dentist-portal-3.emergent.host/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `<p style="color: green;">SUCCESS! Token: ${data.token.substring(0, 20)}...</p>`;
                    
                    // Test dashboard API
                    const dashResponse = await fetch('https://dentist-portal-3.emergent.host/api/admin/dashboard', {
                        headers: {
                            'Authorization': `Bearer ${data.token}`
                        }
                    });
                    
                    console.log('Dashboard response status:', dashResponse.status);
                    const dashData = await dashResponse.json();
                    console.log('Dashboard data:', dashData);
                    
                    if (dashResponse.ok) {
                        resultDiv.innerHTML += `<p style="color: green;">Dashboard API also works!</p>`;
                    } else {
                        resultDiv.innerHTML += `<p style="color: red;">Dashboard API failed: ${dashResponse.status}</p>`;
                    }
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Login failed: ${data.detail || 'Unknown error'}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
