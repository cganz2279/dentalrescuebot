<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - DentalRescueBot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            min-height: 100vh;
        }
        .admin-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .admin-card {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            height: 60px;
            margin-bottom: 2rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .admin-title {
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .admin-subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1f2937;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-1px);
        }
        .login-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 14px;
        }
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 14px;
        }
        .security-note {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            margin-top: 1rem;
            font-size: 13px;
            color: #6b7280;
            text-align: center;
        }
        .debug-info {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            margin-top: 1rem;
            font-size: 12px;
            color: #374151;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .quick-login {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            padding: 12px;
            margin-top: 1rem;
            text-align: center;
        }
        .quick-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin: 4px;
        }
        .quick-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <img src="https://customer-assets.emergentagent.com/job_dental-healing/artifacts/j7ayzg7r_DentalRescueBotWithRoundedText.png" 
                 alt="DentalRescueBot" class="logo">
            
            <h1 class="admin-title">Admin Access</h1>
            <p class="admin-subtitle">Enter your administrator credentials</p>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Administrator Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your admin email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Access Admin Panel
                </button>
            </form>
            
            <div class="quick-login">
                <strong>Quick Login (for testing):</strong><br>
                <button type="button" class="quick-btn" onclick="fillSuperAdmin()">Super Admin</button>
                <button type="button" class="quick-btn" onclick="fillPracticeAdmin()">Practice Admin</button>
            </div>
            
            <div class="security-note">
                🔒 Secure authentication required<br>
                Contact system administrator if you need access
            </div>
            
            <div class="debug-info" id="debugInfo">
                Ready for testing...
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://carebotdental.preview.emergentagent.com/api';
        
        function fillSuperAdmin() {
            document.getElementById('email').value = 'admin@theoncallbot.com';
            document.getElementById('password').value = 'your-super-admin-password-123';
            updateDebug('Super admin credentials filled');
        }
        
        function fillPracticeAdmin() {
            document.getElementById('email').value = 'cganz2279@gmail.com';
            document.getElementById('password').value = 'admin123';
            updateDebug('Practice admin credentials filled');
        }
        
        function updateDebug(message) {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.textContent += `[${timestamp}] ${message}\n`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            updateDebug(`Attempting login with email: ${email}`);
            
            // Reset messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';
            
            try {
                // Clear any existing auth data
                localStorage.removeItem('dentalToken');
                localStorage.removeItem('dentalUser');
                updateDebug('Cleared existing auth data');
                
                // Try super admin login
                updateDebug('Sending request to: ' + BACKEND_URL + '/admin/login');
                
                const response = await fetch(`${BACKEND_URL}/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                updateDebug(`Response status: ${response.status}`);
                
                const data = await response.json();
                updateDebug(`Response data: ${JSON.stringify(data, null, 2)}`);
                
                if (response.ok && data.success) {
                    // Super admin login successful
                    localStorage.setItem('dentalToken', data.token);
                    localStorage.setItem('dentalUser', JSON.stringify({
                        email: email,
                        role: 'super_admin',
                        firstName: 'Admin'
                    }));
                    
                    updateDebug('Super admin login successful - credentials stored');
                    
                    successMessage.textContent = 'Super Admin access granted. Loading admin dashboard...';
                    successMessage.style.display = 'block';
                    
                    setTimeout(() => {
                        updateDebug('Redirecting to React admin dashboard...');
                        window.location.href = 'https://carebot-1.preview.emergentagent.com/admin';
                    }, 2000);
                    return;
                }
                
                // If super admin failed, try practice admin
                updateDebug('Super admin failed, trying practice admin login');
                
                const practiceResponse = await fetch(`${BACKEND_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                updateDebug(`Practice login response status: ${practiceResponse.status}`);
                
                const practiceData = await practiceResponse.json();
                updateDebug(`Practice login response: ${JSON.stringify(practiceData, null, 2)}`);
                
                if (practiceResponse.ok && practiceData.success) {
                    const user = practiceData.user;
                    
                    if (user.role === 'practice_admin') {
                        localStorage.setItem('dentalToken', practiceData.token);
                        localStorage.setItem('dentalUser', JSON.stringify(user));
                        
                        updateDebug('Practice admin login successful');
                        
                        successMessage.textContent = `Welcome ${user.firstName}! Loading practice dashboard...`;
                        successMessage.style.display = 'block';
                        
                        setTimeout(() => {
                            window.location.href = 'https://carebot-1.preview.emergentagent.com/';
                        }, 2000);
                    } else {
                        throw new Error(`User role "${user.role}" does not have admin privileges`);
                    }
                } else {
                    throw new Error(practiceData.detail || practiceData.message || 'Invalid credentials');
                }
                
            } catch (error) {
                updateDebug(`Login error: ${error.message}`);
                console.error('Login error:', error);
                
                errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
                errorMessage.style.display = 'block';
                
                loginBtn.disabled = false;
                loginBtn.textContent = 'Access Admin Panel';
            }
        });
        
        // Initialize debug
        updateDebug('Page loaded and ready');
        updateDebug('Backend URL: ' + BACKEND_URL);
    </script>
</body>
</html>
